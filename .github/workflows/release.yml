name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > astrum-release.jks
          fi

      - name: Run tests and assemble Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :ts6-protocol:test
          :audio-opus:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleRelease
          --stacktrace

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          APK_NAME="Astrum-TS6-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          # Astrum TS6 ${{ env.TAG }}

          Cliente Android de código aberto para TeamSpeak 6 com suporte a voz de baixa latência, transmissão de vídeo e compartilhamento de tela com áudio interno.

          ### Funcionalidades

          - **Vídeo e Câmera WebRTC**: Transmissão em tempo real da câmera e visualização de streams com tela cheia e gestos de zoom.
          - **Compartilhamento de Tela**: Transmissão da tela com captura nativa do áudio do sistema (Android 10+).
          - **Supressão de Ruído Neural (Astrum Clarity)**: Filtragem de ruídos por inteligência artificial e controle de volume por usuário.
          - **Interface Moderna**: Interface em Jetpack Compose com tema escuro e lista de servidores favoritos.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create release or update if exists
          if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.TAG }} already exists. Uploading asset and updating notes..."
            gh release upload "${{ env.TAG }}" "${{ env.APK_NAME }}" --clobber
            gh release edit "${{ env.TAG }}" --notes-file RELEASE_NOTES.md
          else
            echo "Creating new release for ${{ env.TAG }}..."
            gh release create "${{ env.TAG }}" \
              --title "Astrum TS6 ${{ env.TAG }}" \
              --notes-file RELEASE_NOTES.md \
              "${{ env.APK_NAME }}"
          fi
