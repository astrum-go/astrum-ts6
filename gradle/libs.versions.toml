[versions]
agp = "8.7.0"
kotlin = "2.0.0"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
datastore = "1.1.1"
lifecycle = "2.8.7"
coroutines = "1.9.0"
junit = "4.13.2"
